<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0f" />
    <title>KUZUSHI 崩し</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0d0f'/%3E%3Cpath d='M16 5 26 25H6Z' fill='%23f2efe8'/%3E%3Cpath d='M3 24 29 9' stroke='%23ff2e3f' stroke-width='2.5'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;1,600;1,700&family=Barlow:wght@400&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Boku&display=swap" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0d0f; }
      #stage, #overlay { position: fixed; inset: 0; }
      #overlay { pointer-events: none; }

      /*
       * The loader (docs/DESIGN.md, Loading): a dry-brush stroke inked left to right as loading goes, then a red slash
       * through it and the ink thrown apart along the slash over the title. Sizes are px at 1680 x 800, scaled by the
       * window's shorter side; everything moves by transform or opacity, held on twos, so it keeps moving while the
       * page's script is busy. src/host/loading.ts sets --p, the share done.
       */
      #loading {
        --ink: #0d0d0f; --paper: #f2efe8; --red: #ff2e3f; --rule: #35353a;
        --px: calc(min(1vw, 1vh) / 8);
        --line: 52vh;
        --tilt: -12deg;
        --seam: 2px;
        --p: 0;
        position: fixed; inset: 0; z-index: 10; overflow: hidden; background: var(--ink); pointer-events: auto;
      }
      /* The ink in two halves meeting along the slash, each with its own copy of the meter, so the slash cuts it in two. */
      #loading .half { position: absolute; left: 50%; top: var(--line); width: 130vmax; height: 70vmax; overflow: hidden; background: var(--ink); }
      #loading .up { transform-origin: 50% calc(100% - var(--seam)); transform: translate(-50%, calc(var(--seam) - 100%)) rotate(var(--tilt)); }
      #loading .down { transform-origin: 50% 0; transform: translate(-50%, 0) rotate(var(--tilt)); }
      /* Back level at the point the halves turn round; the upper half reaches past the slash, so they show no seam. */
      #loading .pin { position: absolute; left: 50%; width: 0; height: 0; transform: rotate(calc(-1 * var(--tilt))); }
      #loading .up .pin { top: calc(100% - var(--seam)); }
      #loading .down .pin { top: 0; }
      #loading .meter { position: absolute; left: -18vw; top: calc(-14 * var(--px)); width: 36vw; }
      #loading .bar { position: relative; height: calc(28 * var(--px)); overflow: hidden; }
      #loading .stroke { position: absolute; left: 0; top: calc(8 * var(--px)); width: 100%; height: calc(12 * var(--px)); fill: var(--paper); opacity: 0.85; }
      #loading .shutter, #loading .head { position: absolute; inset: 0; transform: translateX(calc(var(--p) * 100%)); transition: transform 120ms steps(2); }
      #loading .shutter { background: var(--ink); }
      #loading .shutter::before { content: ""; position: absolute; left: 0; right: 0; top: calc(13.5 * var(--px)); height: max(1px, var(--px)); background: var(--rule); }
      #loading .head { height: calc(28 * var(--px)); }
      #loading .nib { position: absolute; left: calc(-1 * var(--px)); top: calc(5 * var(--px)); width: max(1.5px, calc(2 * var(--px))); height: calc(18 * var(--px)); background: var(--red); transform: rotate(20deg); animation: loading-flicker calc(1s / 6) steps(1) infinite; }
      #loading .label, #loading .why { margin: calc(4 * var(--px)) 0 0; font: 500 calc(12 * var(--px)) / 1.4 "Barlow Condensed", sans-serif; letter-spacing: 0.32em; text-transform: uppercase; color: rgb(242 239 232 / 0.55); opacity: 0; }
      #loading .label { display: flex; justify-content: space-between; }
      #loading .pct { margin-right: -0.32em; font-variant-numeric: tabular-nums; }
      #loading .why { display: none; }
      html.fonts #loading .label, html.fonts #loading .why, #loading[data-state="error"] .label, #loading[data-state="error"] .why { opacity: 1; }
      #loading[data-state="error"] .why { display: block; }
      #loading[data-state="error"] .pct { visibility: hidden; }
      #loading[data-state="error"] .nib { animation: none; }
      #loading .slash { position: absolute; left: 50%; top: var(--line); width: 150vmax; height: max(2px, calc(2 * var(--px))); background: var(--red); transform: translate(-50%, -50%) rotate(var(--tilt)); opacity: 0; }
      /* The outro, four drawings at 12 a second: the slash, the ink parting along it, then thrown off. */
      #loading.out { background: none; }
      #loading.out .slash { animation: loading-slash 0.333s steps(1) forwards; }
      #loading.out .up { animation: loading-up 0.333s steps(1) forwards; }
      #loading.out .down { animation: loading-down 0.333s steps(1) forwards; }
      @keyframes loading-flicker { 50% { opacity: 0.35; } }
      @keyframes loading-slash { 0%, 25% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes loading-up {
        25% { transform: translate(-50%, calc(var(--seam) - 100%)) rotate(var(--tilt)) translateY(-7vh); }
        50% { transform: translate(-50%, calc(var(--seam) - 100%)) rotate(calc(var(--tilt) - 2deg)) translateY(-32vh); }
        75%, 100% { transform: translate(-50%, calc(var(--seam) - 100%)) rotate(calc(var(--tilt) - 5deg)) translateY(-54vh); }
      }
      @keyframes loading-down {
        25% { transform: translate(-50%, 0) rotate(var(--tilt)) translateY(7vh); }
        50% { transform: translate(-50%, 0) rotate(calc(var(--tilt) + 2deg)) translateY(32vh); }
        75%, 100% { transform: translate(-50%, 0) rotate(calc(var(--tilt) + 5deg)) translateY(54vh); }
      }
      @keyframes loading-fade { to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #loading .nib { animation: none; }
        #loading.out { animation: loading-fade 0.2s linear forwards; }
        #loading.out .slash, #loading.out .up, #loading.out .down { animation: none; }
      }
    </style>
    <script>
      // The loader's words wait for their face, a moment at most, rather than flash in a fallback.
      {
        const show = () => document.documentElement.classList.add("fonts")
        Promise.race([document.fonts.load('500 12px "Barlow Condensed"'), new Promise((resolve) => setTimeout(resolve, 1500))]).then(show, show)
      }
    </script>
  </head>
